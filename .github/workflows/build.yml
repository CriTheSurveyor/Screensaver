name: Build APK

on:
  push:
  workflow_dispatch:

# write access lets the job publish the APK as a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # no gradlew in the repo: this installs the same Gradle the wrapper file names
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # the fixed signing key lives in the repo's Secrets, never in the code
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 mancante"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > app/standby.keystore

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StandBy-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # a Release per build: downloadable from the GitHub app without zips, and what the in-app updater reads
      - name: Release
        run: cp app/build/outputs/apk/debug/app-debug.apk StandBy-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StandBy ${{ github.run_number }}
          files: StandBy-${{ github.run_number }}.apk
